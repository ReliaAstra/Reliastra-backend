[supervisord]
nlogfile=/dev/null
logfile_maxbytes=0
nodaemon=true
logfile_backups=0
loglevel=info

[program:postgres]
user=postgres
command=postgres -D /var/lib/postgresql/data -c listen_addresses="*" -c unix_socket_directories="/var/run/postgresql" -c max_connections=100 -c shared_buffers=128MB
environment=PGDATA="/var/lib/postgresql/data",PGHOST="/var/run/postgresql"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startsecs=2
priority=10

[program:redis]
command=redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --bind 0.0.0.0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startsecs=1
priority=20

[program:celery-worker]
command=/opt/venv/bin/celery -A app.infrastructure.celery_app.celery_app worker --loglevel=info --concurrency=2 --without-heartbeat --without-gossip
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startsecs=5
startretries=10
priority=30

[program:celery-beat]
command=/opt/venv/bin/celery -A app.infrastructure.celery_app.celery_app beat --loglevel=info
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startsecs=3
startretries=10
priority=31

[program:api]
command=/opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startsecs=3
startretries=10
priority=40

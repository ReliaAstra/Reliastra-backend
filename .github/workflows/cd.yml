name: CD — Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Deploy to environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Job 1: Build & Push Docker Image to GHCR ──────────────────────
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Print image info
        run: |
          echo "Image pushed: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

  # ── Job 2: Deploy to VPS ──────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail

            echo "=== Reliastra CD Deployment ==="
            echo "Image: ${IMAGE_TAG}"
            echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""

            # Ensure deploy directory exists
            mkdir -p ~/reliastra
            cd ~/reliastra

            # Copy docker-compose.production.yml if it doesn't exist
            if [ ! -f docker-compose.production.yml ]; then
              echo "Creating production docker-compose file..."
              cat > docker-compose.production.yml << 'COMPOSE_EOF'
            services:
              api:
                image: IMAGE_PLACEHOLDER
                container_name: reliastra-api
                restart: unless-stopped
                ports:
                  - "8000:8000"
                env_file:
                  - .env.production
                depends_on:
                  postgres:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                networks:
                  - reliastra-net

              postgres:
                image: postgres:15-alpine
                container_name: reliastra-postgres
                restart: unless-stopped
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                environment:
                  POSTGRES_USER: reliastra
                  POSTGRES_PASSWORD: \${POSTGRES_PASSWORD:-changeme_production_db_pass}
                  POSTGRES_DB: reliastra
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U reliastra"]
                  interval: 5s
                  timeout: 5s
                  retries: 5
                ports:
                  - "127.0.0.1:5432:5432"
                networks:
                  - reliastra-net

              redis:
                image: redis:7-alpine
                container_name: reliastra-redis
                restart: unless-stopped
                volumes:
                  - redis_data:/data
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 5s
                  timeout: 5s
                  retries: 5
                ports:
                  - "127.0.0.1:6379:6379"
                networks:
                  - reliastra-net

            volumes:
              postgres_data:
              redis_data:

            networks:
              reliastra-net:
                driver: bridge
            COMPOSE_EOF

              # Replace placeholder with actual image
              sed -i "s|IMAGE_PLACEHOLDER|${IMAGE_TAG%% *}|g" docker-compose.production.yml
            fi

            # Update image tag in compose file
            sed -i "s|image: ghcr.io/.*|image: ${IMAGE_TAG%% *}|g" docker-compose.production.yml

            # Pull latest image
            echo "Pulling latest image..."
            docker compose -f docker-compose.production.yml pull api

            # Rolling deploy — stop old, start new
            echo "Deploying new container..."
            docker compose -f docker-compose.production.yml up -d --remove-orphans --force-recreate api

            # Wait for healthy state
            echo "Waiting for API to become healthy..."
            timeout=60
            elapsed=0
            while [ $elapsed -lt $timeout ]; do
              if docker compose -f docker-compose.production.yml exec -T api python -c "
                import urllib.request
                try:
                    r = urllib.request.urlopen('http://localhost:8000/health', timeout=5)
                    print(r.read().decode())
                except Exception as e:
                    print(f'Not ready: {e}')
                    exit(1)
              " 2>/dev/null; then
                echo "API is healthy!"
                break
              fi
              sleep 3
              elapsed=$((elapsed + 3))
            done

            if [ $elapsed -ge $timeout ]; then
              echo "WARNING: API did not become healthy within ${timeout}s"
              echo "Showing recent logs:"
              docker compose -f docker-compose.production.yml logs --tail=50 api
              exit 1
            fi

            # Show deployment summary
            echo ""
            echo "=== Deployment Complete ==="
            echo "Image: ${IMAGE_TAG%% *}"
            echo "API Port: 8000"
            docker compose -f docker-compose.production.yml ps
            echo ""
            echo "Health check:"
            curl -sf http://localhost:8000/health || echo "Health endpoint not responding"

      - name: Notify Deployment Success
        if: success()
        run: |
          echo "Deployment successful!"
          echo "Image: ${{ env.IMAGE_TAG }}"
          echo "Deployed to: ${{ secrets.VPS_HOST }}"

      - name: Notify Deployment Failure
        if: failure()
        run: |
          echo "DEPLOYMENT FAILED — check logs above"
          echo "You may need to SSH into VPS and run: docker compose -f docker-compose.production.yml logs api --tail=100"

name: CI — Lint, Scan & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Python Lint (Ruff) ──────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install ruff

      - name: Run Ruff lint
        run: ruff check app/ tests/

      - name: Run Ruff format check
        run: ruff format --check app/ tests/

  # ── Job 2: Import Validation ──────────────────────────────────────
  imports:
    name: Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify all modules import
        run: python -c "
          import app.main
          import app.config
          import app.dependencies
          import app.core.security
          import app.core.permissions
          import app.core.exceptions
          import app.core.rate_limit
          import app.core.pagination
          import app.core.audit_log
          import app.db.session
          import app.db.base
          from app.modules.auth.router import router as auth_router
          from app.modules.users.router import router as users_router
          from app.modules.organizations.router import router as orgs_router
          from app.modules.dependencies.router import router as deps_router
          from app.modules.checks.router import router as checks_router
          from app.modules.incidents.router import router as incidents_router
          from app.modules.evidence.router import router as evidence_router
          from app.modules.vendors.router import router as vendors_router
          from app.modules.notifications.router import router as notifications_router
          from app.modules.dashboard.router import router as dashboard_router
          from app.modules.billing.router import router as billing_router
          from app.modules.api_keys.router import router as api_keys_router
          from app.modules.auth.google_service import google_auth_service
          from app.modules.auth.github_service import github_auth_service
          from app.modules.auth.schemas import OAuthAuthResponse, GoogleAuthResponse, GitHubAuthResponse
          print('All module imports verified successfully.')
        "

  # ── Job 3: Security Scan (Bandit) ────────────────────────────────
  security:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit security scan
        run: bandit -r app/ -ll -ii --exclude app/__pycache__ --format json --output bandit-report.json || true

      - name: Check for HIGH severity issues
        run: |
          python3 -c "
          import json
          with open('bandit-report.json') as f:
              report = json.load(f)
          highs = [r for r in report.get('results', []) if r.get('issue_severity') == 'HIGH']
          if highs:
              print(f'BLOCKED: {len(highs)} HIGH severity security issues found:')
              for h in highs:
                  print(f'  - {h[\"issue_text\"]} in {h[\"filename\"]}:{h[\"line_number\"]}')
              exit(1)
          else:
              print(f'PASS: No HIGH severity issues. Scanned {report.get(\"metrics\", {}).get(\"loc\", 0)} lines.')
          "

  # ── Job 4: Full Test Suite ────────────────────────────────────────
  test:
    name: Test Suite (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: reliastra_test
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: reliastra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U reliastra_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://reliastra_test:testpass123@localhost:5432/reliastra_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-that-is-at-least-thirty-two-chars-long
      ENVIRONMENT: test
      CORS_ORIGINS: '["http://localhost:3000"]'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short --junitxml=unit-results.xml

      - name: Run integration tests
        run: pytest tests/integration -v --tb=short --junitxml=integration-results.xml

      - name: Run e2e tests
        run: pytest tests/e2e -v --tb=short --junitxml=e2e-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            unit-results.xml
            integration-results.xml
            e2e-results.xml

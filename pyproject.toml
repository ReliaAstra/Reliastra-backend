[tool.poetry]
name = "reliastra-backend"
version = "0.1.0"
description = "Reliastra MVP - External dependency intelligence platform backend"
authors = ["Reliastra Lead Engineer <engineering@reliastra.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = "^0.30.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
celery = "^5.4.0"
redis = "^5.0.0"
httpx = "^0.27.0"
jinja2 = "^3.1.0"
playwright = "^1.44.0"
xhtml2pdf = "^0.2.16"
pyjwt = "^2.8.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "^4.1.0"
cryptography = "^42.0.0"
minio = "^7.2.0"
email-validator = "^2.1.0"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.14.0"
fakeredis = "^2.23.0"
pgserver = "^0.1.4"
moto = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
]

version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: reliastra-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reliastra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reliastra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reliastra-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: reliastra-mailhog
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reliastra-api
    restart: always
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/reliastra
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-reliastra-dev-only-change-in-production-key}
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      # Object storage: Supabase Storage S3 (boto3). Local dev talks to a real
      # Supabase bucket — use a SEPARATE dev bucket from production.
      SUPABASE_S3_ENDPOINT: ${SUPABASE_S3_ENDPOINT:?set SUPABASE_S3_ENDPOINT in .env}
      SUPABASE_S3_REGION: ${SUPABASE_S3_REGION:?set SUPABASE_S3_REGION in .env}
      SUPABASE_S3_ACCESS_KEY_ID: ${SUPABASE_S3_ACCESS_KEY_ID:?set SUPABASE_S3_ACCESS_KEY_ID in .env}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${SUPABASE_S3_SECRET_ACCESS_KEY:?set SUPABASE_S3_SECRET_ACCESS_KEY in .env}
      SUPABASE_S3_BUCKET: ${SUPABASE_S3_BUCKET:?set SUPABASE_S3_BUCKET in .env}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@reliastra.com
      RUN_IN_PROCESS_SCHEDULER: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  celery-worker:
    build:
      context: .
      dockerfile: celery_worker.dockerfile
    container_name: reliastra-celery-worker
    restart: always
    command: celery -A app.infrastructure.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/reliastra
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-reliastra-dev-only-change-in-production-key}
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      # Object storage: Supabase Storage S3 (boto3). Local dev talks to a real
      # Supabase bucket — use a SEPARATE dev bucket from production.
      SUPABASE_S3_ENDPOINT: ${SUPABASE_S3_ENDPOINT:?set SUPABASE_S3_ENDPOINT in .env}
      SUPABASE_S3_REGION: ${SUPABASE_S3_REGION:?set SUPABASE_S3_REGION in .env}
      SUPABASE_S3_ACCESS_KEY_ID: ${SUPABASE_S3_ACCESS_KEY_ID:?set SUPABASE_S3_ACCESS_KEY_ID in .env}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${SUPABASE_S3_SECRET_ACCESS_KEY:?set SUPABASE_S3_SECRET_ACCESS_KEY in .env}
      SUPABASE_S3_BUCKET: ${SUPABASE_S3_BUCKET:?set SUPABASE_S3_BUCKET in .env}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@reliastra.com
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reliastra-celery-beat
    restart: always
    command: celery -A app.infrastructure.celery_app.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/reliastra
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-reliastra-dev-only-change-in-production-key}
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      # Object storage: Supabase Storage S3 (boto3). Local dev talks to a real
      # Supabase bucket — use a SEPARATE dev bucket from production.
      SUPABASE_S3_ENDPOINT: ${SUPABASE_S3_ENDPOINT:?set SUPABASE_S3_ENDPOINT in .env}
      SUPABASE_S3_REGION: ${SUPABASE_S3_REGION:?set SUPABASE_S3_REGION in .env}
      SUPABASE_S3_ACCESS_KEY_ID: ${SUPABASE_S3_ACCESS_KEY_ID:?set SUPABASE_S3_ACCESS_KEY_ID in .env}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${SUPABASE_S3_SECRET_ACCESS_KEY:?set SUPABASE_S3_SECRET_ACCESS_KEY in .env}
      SUPABASE_S3_BUCKET: ${SUPABASE_S3_BUCKET:?set SUPABASE_S3_BUCKET in .env}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@reliastra.com
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  postgres_data:

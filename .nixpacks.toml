# .nixpacks.toml
# Custom Nixpacks configuration for Reliastra-backend

[phases.setup]
nixPkgs = ["python312", "gcc"]
nixLibs = ["zlib", "stdenv.cc.cc.lib"]

[phases.install]
dependsOn = ["setup"]
# Copy the entire project directory first
onlyIncludeFiles = []
# Set up the virtual environment and install dependencies
cmds = [
    "cp -r /build/. /app",
    "python -m venv --copies /opt/venv",
    ". /opt/venv/bin/activate",
    "pip install --upgrade build setuptools",
    "pip install ."
]

[phases.build]
dependsOn = ["install"]
# Run alembic migrations during build (database must be reachable via DATABASE_URL)
cmds = [
    ". /opt/venv/bin/activate",
    "alembic upgrade head"
]

[start]
# Override the start command to run uvicorn directly
cmd = "sh -c '. /opt/venv/bin/activate && uvicorn app.main:app --host 0.0.0.0 --port $PORT'"

# Define NIXPACKS_PATH explicitly to avoid the warning
[variables]
NIXPACKS_PATH = "/opt/venv/bin:$PATH"

# Set the Python version
[build]
pythonVersion = "3.12"
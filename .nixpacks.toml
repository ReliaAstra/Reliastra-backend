# .nixpacks.toml
# Nixpacks configuration for Reliastra-backend (Python FastAPI)

[phases.setup]
nixPkgs = ["python312", "gcc"]
nixLibs = ["zlib", "stdenv.cc.cc.lib"]

[phases.install]
dependsOn = ["setup"]
# Empty onlyIncludeFiles so the full project context is available during install
onlyIncludeFiles = []
cmds = [
    "python -m venv --copies /opt/venv",
    ". /opt/venv/bin/activate",
    "pip install --upgrade pip setuptools build",
    "pip install poetry",
    "poetry config virtualenvs.create false",
    "poetry install --no-interaction --no-ansi --only main"
]

[phases.build]
dependsOn = ["install"]
cmds = [
    "playwright install --with-deps chromium || true"
]

[start]
cmd = ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

[variables]
NIXPACKS_PATH = "/opt/venv/bin:$PATH"

[build]
pythonVersion = "3.12"